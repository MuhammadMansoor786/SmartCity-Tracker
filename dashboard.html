<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Citizen Dashboard - Report Issue</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
        h3 { color: #555; margin-top: 30px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #d9534f; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #c9302c; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .panel-nav { display: flex; align-items: center; gap: 6px; }
        .panel-tab { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border: 1px solid #dee2e6; border-radius: 6px; background: #f8f9fa; color: #343a40; font-size: 14px; font-weight: 600; text-decoration: none; transition: background 0.2s, color 0.2s; }
        .panel-tab:hover { background: #e2e6ea; }
        .panel-tab.active { background: #007bff; border-color: #007bff; color: white; }
        .panel-tab[hidden] { display: none; }
        .logout { background: #6c757d; width: auto; padding: 5px 15px; font-size: 14px; margin-top: 0; }
        @media (max-width: 520px) {
            .container { padding: 20px; }
            .header { align-items: flex-start; }
            .header h2 { width: 100%; }
            .header-actions { width: 100%; }
            .panel-nav { flex: 1; }
            .panel-tab { flex: 1; }
        }
        
        /* Complaints List Styling */
        .issue-card { border: 1px solid #e1e4e8; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fdfdfd; }
        .issue-title { margin: 0 0 5px 0; color: #0056b3; }
        .issue-location { font-size: 13px; color: #666; margin: 0 0 10px 0; }
        .issue-desc { font-size: 14px; margin: 0 0 10px 0; }
        .badge { padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; color: white; }
        .status-Pending { background: #ff9800; }
        .status-In-Progress { background: #2196f3; }
        .status-Resolved { background: #4caf50; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Report a New Issue</h2>
        <div class="header-actions">
            <nav class="panel-nav" aria-label="Panel navigation">
                <span class="panel-tab active" aria-current="page">User Panel</span>
                <a class="panel-tab" id="adminPanelLink" href="/admin.html" hidden>Admin Panel</a>
            </nav>
            <button class="logout" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <form id="issueForm">
        <div class="form-group">
            <input type="text" id="title" placeholder="Masle ka Title (e.g., Tooti hui sarak)" required>
        </div>
        <div class="form-group">
            <input type="text" id="category" placeholder="Category (optional)">
        </div>
        <div class="form-group">
            <input type="text" id="location" placeholder="Exact Location (e.g., Block 4, Street 2)" required>
        </div>
        <div class="form-group">
            <textarea id="description" rows="4" placeholder="Masle ki tafseel likhein..." required></textarea>
        </div>
         <div class="form-group">
            <label style="font-size: 14px; color: #555;">Masle ki tasweer (Optional):</label>
            <input type="file" id="image" accept="image/*">
        </div>
        <button type="submit">Submit Complaint</button>
    </form>
    
    <div id="message"></div>

    <!-- User's Complaints List Section -->
    <h3>Mera Record (My Complaints)</h3>
    <div id="issuesList">
        <p style="text-align: center; color: #777;">Loading...</p>
    </div>
</div>

<script>
    let storedUser = null;
    try {
        storedUser = JSON.parse(localStorage.getItem('user') || 'null');
    } catch (err) {
        storedUser = null;
    }

    const userId = localStorage.getItem('userId') || (storedUser && (storedUser.id || storedUser.user_id));
    if (!userId) {
        window.location.href = '/';
    }

    const isAdminValue = value => value === 1 || value === '1' || value === true || value === 'true';
    const isAdmin = (storedUser && storedUser.role === 'admin')
        || localStorage.getItem('userRole') === 'admin'
        || isAdminValue(storedUser && storedUser.is_admin)
        || isAdminValue(localStorage.getItem('is_admin'));
    document.getElementById('adminPanelLink').hidden = !isAdmin;

    const issueForm = document.getElementById('issueForm');
    const messageDiv = document.getElementById('message');
    const issuesList = document.getElementById('issuesList');

    function getImageSource(imageUrl) {
        return imageUrl.startsWith('data:image') || imageUrl.startsWith('/uploads/')
            ? imageUrl
            : `/uploads/${imageUrl}`;
    }

    async function compressImage(file) {
        const image = new Image();
        const imageUrl = URL.createObjectURL(file);

        try {
            await new Promise((resolve, reject) => {
                image.onload = resolve;
                image.onerror = () => reject(new Error('Could not load the selected image.'));
                image.src = imageUrl;
            });

            if (!image.naturalWidth || !image.naturalHeight) {
                throw new Error('Could not read the selected image.');
            }

            const scale = Math.min(1, 800 / image.naturalWidth);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.naturalWidth * scale);
            canvas.height = Math.round(image.naturalHeight * scale);

            const context = canvas.getContext('2d');
            if (!context) {
                throw new Error('Image compression is unavailable in this browser.');
            }

            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.7);
        } finally {
            URL.revokeObjectURL(imageUrl);
        }
    }

    // Complaint Fetch Karne ka Function
    async function fetchMyIssues() {
        try {
            const res = await fetch(`/api/issues/${userId}`);
            const issues = await res.json();
            
            issuesList.innerHTML = ''; // Loading text hata do

            if(issues.length === 0) {
                issuesList.innerHTML = '<p style="color: #777;">Aapne abhi tak koi complaint darj nahi ki.</p>';
                return;
            }

            // Har complaint ka card banana
            issues.forEach(issue => {
                // Status ke hisaab se color class set karna
                const statusClass = issue.status === 'In Progress' ? 'status-In-Progress' : `status-${issue.status}`;
                
                // IMAGE TAG YAHAN ADD KIYA GAYA HAI
                issuesList.innerHTML += `
                    <div class="issue-card">
                        <h4 class="issue-title">${issue.title}</h4>
                        <p class="issue-location">📍 ${issue.location}</p>
                        <p class="issue-desc">${issue.description}</p>
                        ${issue.image_url ? `<img src="${getImageSource(issue.image_url)}" style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 10px;">` : ''}
                        <span class="badge ${statusClass}">${issue.status}</span>
                    </div>
                `;
            });
        } catch (err) {
            issuesList.innerHTML = '<p style="color: red;">Record load nahi ho saka.</p>';
        }
    }

    issueForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        try {
            const imageFile = document.getElementById('image').files[0];
            const image_url = imageFile ? await compressImage(imageFile) : null;
            const issue = {
                user_id: userId,
                title: document.getElementById('title').value,
                category: document.getElementById('category').value.trim() || null,
                description: document.getElementById('description').value,
                location: document.getElementById('location').value,
                image_url
            };

            const res = await fetch('/api/issues', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(issue)
            });
            
            const data = await res.json();
            messageDiv.style.color = res.ok ? "green" : "red";
            messageDiv.innerText = data.message;
            
            if(res.ok) {
                issueForm.reset(); 
                fetchMyIssues(); 
                setTimeout(() => { messageDiv.innerText = ""; }, 3000); 
            }
        } catch (err) {
            messageDiv.style.color = "red";
            messageDiv.innerText = "Server error!";
        }
    });

    function logout() {
        ['userId', 'userRole', 'user', 'is_admin'].forEach(key => localStorage.removeItem(key));
        window.location.href = '/'; 
    }

    // Page Load Hote Hi Function Call Karo
    fetchMyIssues();
</script>
</body>
</html>
