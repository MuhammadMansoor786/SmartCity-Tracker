[build]
publish = "."
functions = "netlify/functions"

[build.environment]
SECRETS_SCAN_OMIT_KEYS = "DB_NAME,DB_PORT,DB_USER,DB_SSL"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[redirects]]
from = "/uploads/*"
to = "/.netlify/functions/api/uploads/:splat"
status = 200
